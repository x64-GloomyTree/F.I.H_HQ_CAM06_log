<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');

  :root {
    --ar: 1.33;                                  /* gif aspect ratio, set by JS */
    --fw: min(80vw, calc(52vh * var(--ar)));     /* feed width: drives all sizing */
  }

  html, body { margin:0; height:100%; background:#020402; overflow:hidden; }
  body {
    font-family:'VT323','Lucida Console',monospace;
    color:#fff;
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
    padding-bottom:4vh;
    box-sizing:border-box;
    -webkit-font-smoothing:none; font-smooth:never;
    text-shadow:0 0 2px rgba(255,255,255,.6), 1px 0 rgba(255,0,0,.35), -1px 0 rgba(0,120,255,.35);
    animation:flicker 4s infinite;
  }

  /* Camera feed */
  #feed {
    position:relative;
    width:var(--fw);
    border:max(2px, calc(var(--fw) * .005)) solid #444;
    box-shadow:0 0 calc(var(--fw) * .05) rgba(0,255,100,.15);
  }
  #feed.glitch { animation:jitter .35s steps(1) 1; }
  #gif {
    display:block; width:100%;
    image-rendering:pixelated;
    filter:contrast(1.05) saturate(.9) sepia(.4) hue-rotate(60deg);
  }
  #feed.glitch #gif {
    filter:contrast(1.3) saturate(1.2) sepia(.4) hue-rotate(75deg) brightness(1.15);
  }
  .cam {
    position:absolute;
    font-size:calc(var(--fw) * .05);
    letter-spacing:.1em;
    color:#fff; text-shadow:1px 1px 0 #000, 0 0 4px rgba(255,255,255,.5);
    padding:calc(var(--fw) * .012) calc(var(--fw) * .02);
    pointer-events:none;
  }
  .tl{top:0;left:0} .tr{top:0;right:0}
  .bl{bottom:0;left:0} .br{bottom:0;right:0}
  .rec {
    display:inline-block;
    width:calc(var(--fw) * .022); height:calc(var(--fw) * .022);
    margin-right:calc(var(--fw) * .014);
    background:#f22; border-radius:50%; box-shadow:0 0 6px #f22;
    animation:blink 1s steps(1) infinite;
  }
  .corner {
    position:absolute;
    width:calc(var(--fw) * .04); height:calc(var(--fw) * .04);
    border:max(2px, calc(var(--fw) * .004)) solid rgba(255,255,255,.7);
    pointer-events:none;
  }
  .c1{top:2%;left:2%;border-right:0;border-bottom:0}
  .c2{top:2%;right:2%;border-left:0;border-bottom:0}
  .c3{bottom:2%;left:2%;border-right:0;border-top:0}
  .c4{bottom:2%;right:2%;border-left:0;border-top:0}

  /* Status UI */
  .ui { margin-top:calc(var(--fw) * .05); text-align:center; letter-spacing:.06em; width:var(--fw); }
  .label  { font-size:calc(var(--fw) * .08); line-height:1.1; }
  .status { font-size:calc(var(--fw) * .105); line-height:1.1; color:#39ff5a; text-shadow:0 0 8px #39ff5a; }
  .sub    { font-size:calc(var(--fw) * .048); margin-top:calc(var(--fw) * .012); opacity:.85; }
  .cursor::after { content:"_"; animation:blink 1s steps(1) infinite; }

  /* Scanlines + vignette */
  .crt::before {
    content:""; position:fixed; inset:0; pointer-events:none; z-index:10;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.7) 100%);
  }
  #noise {
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:11; opacity:.09; mix-blend-mode:screen;
  }
  .crt::after {
    content:""; position:fixed; left:0; right:0; height:80px; z-index:12;
    pointer-events:none;
    background:linear-gradient(transparent, rgba(255,255,255,.04), transparent);
    animation:roll 7s linear infinite;
  }
  /* Disconnect button */
  #disc{
    position:fixed; top:2vmin; right:2vmin; z-index:9;
    font-size:clamp(18px,2.6vmin,30px); letter-spacing:.12em;
    color:#9f9; text-decoration:none; padding:.2em .7em;
    border:1px solid rgba(153,255,153,.5); background:rgba(0,0,0,.45);
    text-shadow:0 0 6px rgba(80,255,120,.6);
  }
  #disc:hover{ background:rgba(40,120,60,.45); color:#fff; }
  
  /* Legacy feed marker (top center of the feed) */
  .tc{
    top:0; left:50%; transform:translateX(-50%);
    font-size:calc(var(--fw) * .04); white-space:nowrap;
    color:#ffd75a; text-shadow:0 0 6px rgba(255,200,60,.6), 1px 1px 0 #000;
    animation:slowblink 3s steps(1) infinite;
  }
  @keyframes slowblink{ 0%,70%{opacity:1} 71%,100%{opacity:.35} }
  
  /* Fade-out used when disconnecting */
  #fade{ position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; z-index:40; transition:opacity .5s; }
  #fade.on{ opacity:1; pointer-events:auto; }
  @keyframes roll { from{top:-100px} to{top:100%} }
  @keyframes blink { 50%{opacity:0} }
  @keyframes flicker { 0%,100%{opacity:1} 92%{opacity:1} 93%{opacity:.92} 94%{opacity:1} 97%{opacity:.95} }
  @keyframes jitter {
    0%   { transform:translate(3px,-1px) skewX(2deg); }
    20%  { transform:translate(-4px,2px); }
    40%  { transform:translate(2px,1px) skewX(-3deg); }
    60%  { transform:translate(-3px,-2px); }
    80%  { transform:translate(4px,0); }
    100% { transform:none; }
  }

  #start {
    position:fixed; inset:0; z-index:20; background:#000;
    display:flex; align-items:center; justify-content:center;
    font-size:clamp(1.5rem, 4vw, 3rem); cursor:pointer; color:#9f9;
  }
</style>
</head>
<body class="crt">

<div id="start">[ click to connect ]</div>
<a id="disc" href="https://x64-gloomytree.github.io/F.I.H_EmployeeRecord32/">[ DISCONNECT ]</a>
<div id="fade"></div>
<div id="feed">
  <img id="gif" src="cam06_log.gif" alt="">
  <div class="cam tl"><span class="rec"></span>REC</div>
  <div class="cam tr">CAM06</div>
  <div class="cam bl" id="clock">--/--/---- --:--:--</div>
  <div class="cam br" id="elapsed">00:00:00</div>
  <div class="cam tc">LEGACY FEED</div>
  <div class="corner c1"></div><div class="corner c2"></div>
  <div class="corner c3"></div><div class="corner c4"></div>
</div>

<div class="ui">
  <div class="label">Target Status :</div>
  <div class="status">Manifested</div>
  <div class="sub cursor">Awaiting agent deploy</div>
</div>

<audio id="bgm" src="ambient.mp3" loop preload="auto"></audio>
<canvas id="noise"></canvas>

<script>
  // Read real gif aspect ratio so sizing fits any gif
  const gifEl = document.getElementById('gif');
  function setAR(){
    if (gifEl.naturalWidth) {
      document.documentElement.style.setProperty('--ar', gifEl.naturalWidth / gifEl.naturalHeight);
    }
  }
  if (gifEl.complete) setAR(); else gifEl.addEventListener('load', setAR);
  document.getElementById('disc').addEventListener('click', e => {
    e.preventDefault();
    const url = e.currentTarget.href;
    document.getElementById('fade').classList.add('on');
    setTimeout(() => { location.href = url; }, 550);
  });
  // Audio: quiet + muffled through a low-pass filter
  const bgm = document.getElementById('bgm');
  document.getElementById('start').addEventListener('click', e => {
    const AC = window.AudioContext || window.webkitAudioContext;
    const actx = new AC();
    const src = actx.createMediaElementSource(bgm);

    const lp = actx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;    // lower = more muffled
    lp.Q.value = 0.7;

    const gain = actx.createGain();
    gain.gain.value = 0.12;      // volume 0 to 1

    src.connect(lp).connect(gain).connect(actx.destination);
    actx.resume();
    bgm.play();
    e.currentTarget.remove();
  });

  // Animated static noise
  const c = document.getElementById('noise'), ctx = c.getContext('2d');
  function resize(){ c.width = innerWidth/3; c.height = innerHeight/3; }
  resize(); addEventListener('resize', resize);
  c.style.imageRendering = 'pixelated';
  function draw(){
    const img = ctx.createImageData(c.width, c.height), d = img.data;
    for (let i=0;i<d.length;i+=4){
      const v = Math.random()*255;
      d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
    }
    ctx.putImageData(img,0,0);
  }
  setInterval(draw, 80);

  // Feed clock (viewer's date/time) + fake elapsed timer with RNG offset
  const pad = n => String(n).padStart(2,'0');
  let start = Number(localStorage.getItem('cam06_start'));
  if (!start) {
    const hours = 18 + Math.random()*52;
    const extra = Math.floor(Math.random()*3600);
    start = Date.now() - (hours*3600 + extra)*1000;
    localStorage.setItem('cam06_start', start);
  }
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    const s = Math.floor((Date.now()-start)/1000);
    document.getElementById('elapsed').textContent =
      `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
  }
  tick(); setInterval(tick, 1000);

  // Random glitch jitter every 4 to 14 seconds, sometimes a double hit
  const feed = document.getElementById('feed');
  function glitch(){
    feed.classList.remove('glitch');
    void feed.offsetWidth;
    feed.classList.add('glitch');
    if (Math.random() < 0.3) setTimeout(glitch, 450);
  }
  (function schedule(){
    setTimeout(() => { glitch(); schedule(); }, 4000 + Math.random()*10000);
  })();
</script>
</body>
</html>
